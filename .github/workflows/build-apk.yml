name: Build Alpha Byte APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm install

      - name: Build web directory for Capacitor
        run: npm run build

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Align generated Capacitor code with JDK 17
        run: node scripts/prepare-java17-capacitor.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Byte-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare optional signed release
        if: ${{ secrets.ALPHA_KEYSTORE_BASE64 != '' && secrets.ALPHA_KEYSTORE_PASSWORD != '' && secrets.ALPHA_KEY_ALIAS != '' && secrets.ALPHA_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > alpha-byte-release.jks
          cat > signing.properties <<EOF
          storeFile=alpha-byte-release.jks
          storePassword=$ALPHA_KEYSTORE_PASSWORD
          keyAlias=$ALPHA_KEY_ALIAS
          keyPassword=$ALPHA_KEY_PASSWORD
          EOF
          fingerprint="$(keytool -list -v -keystore alpha-byte-release.jks -storepass "$ALPHA_KEYSTORE_PASSWORD" -alias "$ALPHA_KEY_ALIAS" -keypass "$ALPHA_KEY_PASSWORD" | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print $2; exit}')"
          test -n "$fingerprint"
          echo "ALPHA_RELEASE_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ALPHA_RELEASE_CERT_SHA256 != '' }}
        working-directory: android
        run: ./gradlew assembleRelease -PALPHA_RELEASE_CERT_SHA256="$ALPHA_RELEASE_CERT_SHA256" --no-daemon

      - name: Upload signed release APK
        if: ${{ env.ALPHA_RELEASE_CERT_SHA256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Byte-signed-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
